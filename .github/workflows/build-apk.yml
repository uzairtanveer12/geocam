name: Build APK
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the APK to (example: v1.0.5). Leave empty to only build."
        required: false
        default: ""
  push:
    branches: [main, master]
    tags: ['**']
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'docs/**'
      - 'assets/social-preview.png'
      - 'reports/**'
      - 'worker/**'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - name: Android 14+ setup, permissions and gallery saver
        run: |
          sed -i 's/minSdkVersion = .*/minSdkVersion = 34/' android/variables.gradle
          mkdir -p android/app/src/main/java/com/geocam/app
          cp native/GalleryPlugin.java native/NativeCamPlugin.java native/GnssPlugin.java native/MainActivity.java android/app/src/main/java/com/geocam/app/
          sed -i -e '/^dependencies {/a\    implementation "androidx.camera:camera-core:1.3.4"' -e '/^dependencies {/a\    implementation "androidx.camera:camera-camera2:1.3.4"' -e '/^dependencies {/a\    implementation "androidx.camera:camera-lifecycle:1.3.4"' -e '/^dependencies {/a\    implementation "androidx.camera:camera-view:1.3.4"' android/app/build.gradle
          F=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <uses-feature android:name="android.hardware.camera" android:required="false"/>\n    <uses-feature android:name="android.hardware.location.gps" android:required="false"/>\n    <application#' $F
          sed -i 's#<activity#<activity android:screenOrientation="portrait"#' $F
          sed -i "s/versionCode 1/versionCode $(date +%s)/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"$VERSION\"/" android/app/build.gradle
          mkdir -p ~/.android && cp native/debug.keystore ~/.android/debug.keystore
          cp native/debug.keystore android/app/debug.keystore
          printf '\nandroid {\n    signingConfigs {\n        debug {\n            storeFile file("debug.keystore")\n            storePassword "android"\n            keyAlias "androiddebugkey"\n            keyPassword "android"\n        }\n    }\n}\n' >> android/app/build.gradle
      - name: App icon (only used if assets/icon-only.png exists)
        run: |
          if [ -f assets/icon-only.png ]; then
            if [ ! -f assets/icon-foreground.png ]; then
              pip install pillow -q
              python3 scripts/make_icon_layers.py
            fi
            npm install --no-save @capacitor/assets@3.0.5
            npx @capacitor/assets generate --android --iconBackgroundColor "#05080c"
          else
            echo "No custom icon found, using the default icon"
          fi
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Show signing certificate
        continue-on-error: true
        run: |
          AS=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          $AS verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA-256"
      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "GeoCam-$VERSION.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: GeoCam-apk
          path: GeoCam-*.apk
      - name: Attach APK to the release
        if: github.event.inputs.tag != '' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          files: GeoCam-*.apk
