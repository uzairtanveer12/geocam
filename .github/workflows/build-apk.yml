name: Build APK
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the APK to (example: v1.0.5). Leave empty to only build."
        required: false
        default: ""
  push:
    branches: [main, master]
    tags: ['**']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - name: Android 14+ setup, permissions and gallery saver
        run: |
          sed -i 's/minSdkVersion = .*/minSdkVersion = 34/' android/variables.gradle
          mkdir -p android/app/src/main/java/com/geocam/app
          cp native/GalleryPlugin.java native/MainActivity.java android/app/src/main/java/com/geocam/app/
          F=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <uses-feature android:name="android.hardware.camera" android:required="false"/>\n    <uses-feature android:name="android.hardware.location.gps" android:required="false"/>\n    <application#' $F
          sed -i 's#<activity#<activity android:screenOrientation="portrait"#' $F
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"$VERSION\"/" android/app/build.gradle
          mkdir -p ~/.android && cp native/debug.keystore ~/.android/debug.keystore
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "GeoCam-$VERSION.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: GeoCam-apk
          path: GeoCam-*.apk
      - name: Attach APK to the release
        if: github.event.inputs.tag != '' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          files: GeoCam-*.apk
